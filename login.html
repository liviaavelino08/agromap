<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AgroMap</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>AgroMap</h1>

            <p>
                Entre na sua conta
            </p>


            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>


                <div id="mensagem"></div>

            </form>


            <p>

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
