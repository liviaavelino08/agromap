<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#315f3d">
  <title>Entrar | AgroMap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main class="auth-layout auth-layout-login">
    <a class="back-link" href="index.html">← Voltar ao início</a>

    <section class="auth-card auth-card-login">
      <a class="auth-brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>Agro<span>Map</span></span>
      </a>

      <h1>Bem-vindo de volta</h1>

      <p class="intro">
        Entre com os dados da sua conta AgroMap.
      </p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="voce@exemplo.com"
          required
        >

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="current-password"
          placeholder="Digite sua senha"
          required
        >

        <button type="submit" class="submit-button">
          Entrar <span>→</span>
        </button>

        <div
          id="mensagem"
          class="message"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <p class="auth-switch">
        Ainda não possui uma conta?
        <a href="cadastro.html">Criar conta</a>
      </p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
