
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | AgroMap</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<main class="login-container">
    <section class="login-card">
        <a href="index.html" class="back-link">← Voltar ao início</a>

        <h1>Agro<span>Map</span></h1>
        <p>Entre na sua conta.</p>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Digite sua senha" required>

            <button type="submit" id="entrarBtn">Entrar</button>
            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>

        <p>Ainda não possui uma conta?
            <a href="cadastro.html">Criar conta</a>
        </p>
    </section>
</main>

<script>
document.getElementById("loginForm").addEventListener("submit",
async function (evento) {
    evento.preventDefault();

    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("entrarBtn");

    mensagem.textContent = "Verificando seus dados...";
    botao.disabled = true;

    try {
        const resposta = await fetch("api.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "login",
                email: document.getElementById("email").value.trim(),
                senha: document.getElementById("senha").value
            })
        });

        const resultado = await resposta.json();

        if (!resposta.ok || resultado.erro || resultado.sucesso === false) {
            throw new Error(resultado.mensagem || resultado.erro ||
                            "E-mail ou senha inválidos.");
        }

        mensagem.textContent = resultado.mensagem || "Login realizado!";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 500);

    } catch (erro) {
        mensagem.textContent =
            "Não foi possível entrar: " + erro.message;
    } finally {
        botao.disabled = false;
    }
});
</script>

</body>
</html>
